version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Held until the move to Android Gradle Plugin 9: these releases need AGP 9.1+
    # (or, for Gradle, drop APIs AGP 8 uses). Remove together with the migration,
    # which must also re-check the F-Droid reproducible build.
    ignore:
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">=2026.11.01"]
      - dependency-name: "androidx.navigation:*"
        versions: [">=2.10.0"]
      - dependency-name: "androidx.hilt:*"
        versions: [">=1.4.0"]
      - dependency-name: "com.google.dagger*"
        versions: [">=2.60"]
    groups:
      # Kotlin, its Gradle plugins (including the Compose compiler plugin) and KSP move together:
      # each KSP release is built for one Kotlin version.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx:*"
      test:
        patterns:
          - "junit:junit"
          - "org.robolectric:*"
          - "androidx.test*"
      androidx:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.test*"
      hilt:
        patterns:
          - "com.google.dagger*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
