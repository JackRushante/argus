name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: the job only reads the repository.
permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle (written only by runs on the default branch) and validates the wrapper jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests and lint
        run: ./gradlew :engine-core:test testDebugUnitTest lintDebug --stacktrace

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: E2E suite unit tests (offline)
        run: python -m unittest discover -s e2e/tests

      - name: Hermes bridge tests
        working-directory: ops/hermes
        run: python -m unittest test_bridge
